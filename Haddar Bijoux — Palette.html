<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haddar Bijoux — Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F1; --panel:#FFFFFF; --gold:#B68A4E; --gold-deep:#8F6B39;
    --gold-pale:#EAE0CB; --ink:#2A241E; --ink-soft:#6E6459; --line:#E4DCCB;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Jost',sans-serif; font-weight:300;}
  .wrap{max-width:640px; margin:0 auto; padding:56px 28px 64px;}
  h1{font-family:'Italiana',serif; font-weight:400; font-size:2.2rem; margin:0 0 6px;}
  .tag{color:var(--ink-soft); font-size:.95rem; margin:0 0 44px;}
  h2{font-size:.78rem; letter-spacing:.08em; color:var(--ink-soft); font-weight:500; margin:0 0 14px;}
  .swatches{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:48px;}
  .sw{aspect-ratio:1; border-radius:2px; display:flex; align-items:flex-end; padding:8px; font-size:.68rem;}
  .sw span{background:rgba(255,255,255,.75); padding:2px 5px; border-radius:2px;}
  .type-block{background:var(--panel); border:1px solid var(--line); padding:36px 32px; margin-bottom:40px;}
  .type-block .big{font-family:'Italiana',serif; font-size:2.6rem; margin:0 0 10px;}
  .type-block .body{color:var(--ink-soft); max-width:40ch; margin:0;}
  .frames{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .frame{aspect-ratio:4/5; border:1px solid var(--gold); position:relative; display:flex; align-items:center; justify-content:center;}
  .frame span{font-size:.72rem; color:var(--ink-soft); letter-spacing:.03em;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Haddar Bijoux</h1>
  <p class="tag">Palette &amp; typographie — aperçu avant intégration</p>

  <h2>Couleurs</h2>
  <div class="swatches">
    <div class="sw" style="background:#F7F5F1;"><span>F7F5F1</span></div>
    <div class="sw" style="background:#FFFFFF; border:1px solid #E4DCCB;"><span>FFFFFF</span></div>
    <div class="sw" style="background:#EAE0CB;"><span>EAE0CB</span></div>
    <div class="sw" style="background:#B68A4E; color:#fff;"><span style="background:rgba(0,0,0,.2); color:#fff;">B68A4E</span></div>
    <div class="sw" style="background:#2A241E;"><span style="background:rgba(255,255,255,.15); color:#fff;">2A241E</span></div>
  </div>

  <h2>Typographie</h2>
  <div class="type-block">
    <p class="big">Haddar Bijoux</p>
    <p class="body">Or 18 carats, façonné à la main pour traverser le temps. — Jost, léger, pour le texte courant.</p>
  </div>

  <h2>Avec des photos produit</h2>
  <div class="frames">
    <div class="frame"><span>photo produit</span></div>
    <div class="frame"><span>photo produit</span></div>
  </div>
</div>
</body>
</html>
